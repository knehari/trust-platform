[package]
name = "trust-db-connect"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PostgreSQL connections for the platform's processes: TLS with server verification against one configured CA when TRUST_DATABASE_CA_FILE is set (ADR-0031), and the login's client certificate when TRUST_DATABASE_CLIENT_CERT_DIR is set (ADR-0036)."

[dependencies]
postgres = "=0.19.12"
serde_json = "=1.0.149"
# Already locked through reqwest's rustls-tls; the ring provider, no native roots.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
