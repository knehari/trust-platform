[package]
name = "trust-management-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
postgres = "=0.19.12"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
uuid = "=1.18.1"
httpdate = "=1.0.3"
trust-pki-core = { path = "../pki-core", features = ["postgres-store"] }
base64 = "=0.22.1"
x509-cert = "=0.2.5"

[dev-dependencies]
# tls12 only to prove the lab APIs refuse a TLS 1.2 client.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.2", features = ["io-util"] }
rand = "=0.8.6"
rsa = { version = "=0.9.8", features = ["pem"] }
tower = "=0.5.3"
http-body-util = "=0.1.5"
trust-pki-core = { path = "../pki-core", features = ["lab-software", "postgres-store"] }
trust-pki-crypto = { path = "../pki-crypto", features = ["lab-software"] }
