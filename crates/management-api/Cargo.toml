[package]
name = "trust-management-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.22.1"
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
postgres = "=0.19.12"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
# Reviewed P-256 ECDSA verification for approver signatures (ADR-0011).
trust-pki-crypto = { path = "../pki-crypto" }
# Strict PKCS#10 verification for certificate applications (ADR-0016); no
# features, so no lab software signing enters the API build.
trust-pki-core = { path = "../pki-core" }
# Parsing of a proposed CA's issuer certificate (ADR-0013); the same pinned
# version as trust-pki-core.
x509-cert = { version = "=0.2.5", features = ["pem"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "sync"] }
uuid = "=1.18.1"

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa", "pem"] }
rand = "=0.8.5"
# Test-only ephemeral roots and CSR keys; lab software signing never enters
# the API build (the feature is enabled for tests only).
trust-pki-core = { path = "../pki-core", features = ["lab-software"] }
# The laboratory signer, run in-process by the issuance test only.
trust-lab-signer = { path = "../lab-signer" }
rsa = { version = "=0.9.8", features = ["pem"] }
tower = "=0.5.3"
http-body-util = "=0.1.5"
