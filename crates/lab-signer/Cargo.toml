[package]
name = "trust-lab-signer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Laboratory-only signer for approved certificate applications (ADR-0017). Never linked into the API binary; only the API tests run it."

[dependencies]
base64 = "=0.22.1"
# The only process that reads a CA private key: a P-256 software key file, for
# the disposable laboratory only.
p256 = { version = "=0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
# PKCS#11 adapter (ADR-0034): the CA key stays in a token, non-extractable.
cryptoki = "=0.10.0"
postgres = "=0.19.12"
trust-db-connect = { path = "../db-connect" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
trust-pki-core = { path = "../pki-core" }
x509-cert = { version = "=0.2.5", features = ["pem"] }

[dev-dependencies]
rand = "=0.8.5"
trust-pki-core = { path = "../pki-core", features = ["lab-software"] }
