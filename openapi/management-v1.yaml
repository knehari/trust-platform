      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
