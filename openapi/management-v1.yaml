  /v1/ca-proposals/{ca_id}/change-requests/{request_id}/application:
    post:
      summary: Apply an approved change request (laboratory, migration 0028)
      description: By an administrator who did not decide on the request, while the CA is still in the state the request was made in. Reactivation refuses an expired issuer certificate. Retirement is final and retires the CA's active profile revisions in the same transaction (ADR-0015, Proposed).
      parameters:
        - { in: path, name: ca_id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: request_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Change applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaOperationalState' }
        '200':
          description: Replay with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaOperationalState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or ca-administrator platform grant, or the caller decided on the request }
        '404': { description: No such request for this CA }
        '409': { description: Idempotency key reused, the request is not APPROVED or was applied, or the CA changed state since the request }
        '413': { description: Request body above 16 KiB }
