  /v1/cas/{ca_id}/certificate-applications:
    get:
      summary: List certificate applications of a CA (laboratory, migration 0029)
      description: Newest first, at most 100, for readers of the CA. Requester and officer identities are not returned. Nothing is signed (ADR-0016, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/CertificateApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing reader role or CA outside the signed scope }
        '503': { description: The database is unavailable }
    post:
      summary: Submit a certificate application (laboratory, migration 0029)
      description: "Requires the trust-certificate-requester role, the CA in scope and a certificate-requester grant. The API verifies the CSR (canonical DER, PKCS#10 v1, ECDSA-SHA256, uncompressed P-256 key, subject exactly CN=common_name, proof of possession) and never uses its extensions. The database requires a lifecycle-managed ACTIVE CA and the profile's ACTIVE revision, and checks names (count, repeats, zones at a label boundary), the CN among them, the validity, and that the key is not the CA's. Nothing is signed (ADR-0016, Proposed)."
      parameters:
        - $ref: '#/components/parameters/CaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile_id, csr_pem, common_name, dns_names, validity_days]
              properties:
                profile_id: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
                csr_pem: { type: string, maxLength: 15000, description: One PEM CERTIFICATE REQUEST block }
                common_name: { type: string, description: One of dns_names }
                dns_names: { type: array, minItems: 1, maxItems: 100, items: { type: string, pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', maxLength: 253 } }
                validity_days: { type: integer, minimum: 1, maximum: 825 }
      responses:
        '201':
          description: Application recorded (SUBMITTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateApplicationSubmitted' }
        '200':
          description: Replay with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateApplicationSubmitted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-certificate-requester role, CA outside the signed scope, or no certificate-requester grant }
        '404': { description: The profile has no ACTIVE revision for this CA }
        '409': { description: Idempotency key reused for another request }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422':
          description: "The CSR is refused (body reason: Encoding, SubjectMismatch, InvalidSignature or UnsupportedKey), or the CA is not an ACTIVE lifecycle-managed CA, or the names, validity or key do not fit the profile (no body). Nothing was recorded."
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/decision-claims:
    post:
      summary: Prepare the claim a registration officer signs to decide on an application (laboratory, migration 0041)
      description: >-
        Records nothing. Requires the trust-registration-officer role, the CA in scope, a registration-officer
        grant and an active registration officer key the database owner registered. Returns the exact one-line
        claim the database builds (trust_pki_core::authorization::officer_decision_claim): decision, CA,
        application, profile and revision, SHA-256 of the CSR DER, subject CN, DNS names, validity, optional
        extensions, key and issued_at. The claim is valid for 600 seconds. The laboratory signer verifies the
        officer's signature over the same claim, rebuilt from the application, before it signs (ADR-0028,
        Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
                required: [decision, claim, key_id, issued_at, valid_for_seconds]
                properties:
                  decision: { type: string, enum: [approve, reject] }
                  claim: { type: string }
                  key_id: { type: string }
                  issued_at: { type: string, description: 'UTC, YYYY-MM-DDTHH:MM:SS.mmmZ' }
                  valid_for_seconds: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or no registered officer key }
        '404': { description: No such application for this CA }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/decision:
    post:
      summary: Record a registration officer's signed decision on a certificate application (laboratory, migrations 0029 and 0041)
      description: >-
        Requires the trust-registration-officer role, the CA in scope and a registration-officer grant; the officer
        cannot be the requester. Once per application. Approval also requires the CA to be ACTIVE and the
        application's revision to be still the profile's active one. Since migration 0041 the decision carries the
        officer's ECDSA P-256 / SHA-256 DER signature over the claim from decision-claims, issued less than ten
        minutes ago; the API verifies it with the officer's registered key in the recording transaction (422 and
        nothing recorded when it does not verify). The laboratory signer verifies it again before signing
        (ADR-0028, Proposed). Incompatible change: unsigned decisions are refused (400).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, issued_at, signature_der_base64]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, minLength: 1, maxLength: 500 }
                issued_at: { type: string, description: The issued_at of the signed claim }
                signature_der_base64: { type: string, description: 'DER ECDSA signature, base64, 8 to 80 bytes' }
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, application_id, status]
                properties:
                  ca_id: { type: string, format: uuid }
                  application_id: { type: string, format: uuid }
                  status: { type: string, enum: [APPROVED, REJECTED] }
        '200': { description: Replay with the same Idempotency-Key }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or the caller is the requester }
        '404': { description: No such application for this CA }
        '409': { description: Idempotency key reused, already decided, the claim expired, or (approval) the CA or the revision is no longer active }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422': { description: The signature does not verify with the officer's registered key over the claim; nothing recorded }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/issuance:
    post:
      summary: Issue an approved certificate application through the laboratory signer (laboratory, migration 0030)
      description: "Requires the trust-registration-officer role with a registration-officer grant, or the trust-certificate-requester role for the application's own requester while still granted; the CA in scope. The database requires the application APPROVED, the CA ACTIVE and its revision still active, then reserves an issuer-scoped serial. The API builds the server leaf TBS from the stored CSR's key and the application's names, journals the signing intent, and asks the laboratory signer over a Unix socket; the signer re-checks everything independently and claims the intent once. The API verifies the certificate independently before it is stored. An intent is never signed twice. Laboratory software key only (ADR-0017, Proposed). Since migration 0041 the application must carry a signed authorization (an RA request, or a registration officer's signed approval); without one the API refuses with 409 before reserving a serial, and the signer refuses any intent whose authorization signature does not verify with a key the database owner registered (ADR-0028, Proposed)."
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateIssuance' }
        '200':
          description: Already issued; the certificate is not returned again (it is listed by its serial and digest)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateIssuance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or a requester asking for another requester's application }
        '404': { description: No such application for this CA }
        '409': { description: Idempotency key reused; the application is not APPROVED; the CA or revision is no longer active; or a signing intent already exists (ISSUING or RECONCILIATION_REQUIRED) }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422': { description: The stored CSR or issuer certificate no longer verifies; nothing was signed }
        '502':
          description: The signing outcome is ambiguous (the signer refused or failed after the intent, or the certificate failed independent verification); the request is RECONCILIATION_REQUIRED and is never signed again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateIssuance' }
        '503': { description: No laboratory signer socket is configured, or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/revocation-requests:
    post:
      summary: Request revocation of an issued certificate (laboratory, migration 0031)
      description: "Requires the application's own requester (trust-certificate-requester role, still granted) or a registration officer; the CA in scope. The certificate must be issued and not revoked, with no open request, and the CA ACTIVE or SUSPENDED. The reason code comes from a closed RFC 5280 list (0 unspecified, 1 keyCompromise, 3 affiliationChanged, 4 superseded, 5 cessationOfOperation, 9 privilegeWithdrawn) (ADR-0018, Proposed)."
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code, reason]
              properties:
                reason_code: { type: integer, enum: [0, 1, 3, 4, 5, 9] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Request recorded
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, application_id, revocation_id, status]
                properties:
                  ca_id: { type: string, format: uuid }
                  application_id: { type: string, format: uuid }
                  revocation_id: { type: string, format: uuid }
                  status: { type: string, enum: [REVOCATION_REQUESTED] }
        '200': { description: Replay with the same Idempotency-Key }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or another requester's application }
        '404': { description: No certificate was issued for this application }
        '409': { description: Idempotency key reused, already revoked, a request already open, or the CA retired }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/revocation-requests/{revocation_id}/decision-claims:
    post:
      summary: Prepare the claim a registration officer signs to decide on a revocation request (laboratory, migration 0042)
      description: >-
        Records nothing. Requires the trust-registration-officer role, a registration-officer grant and an active
        registered officer key. Returns trust-platform/revocation-authorization/v1 with the decision, CA, application,
        revocation request, serial (hex), reason code, key and issued_at (trust_pki_core::authorization::revocation_decision_claim);
        valid 600 seconds. The laboratory signer rebuilds and verifies it before any CRL lists the serial (ADR-0029, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: revocation_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
                required: [decision, claim, key_id, issued_at, valid_for_seconds]
                properties:
                  decision: { type: string }
                  claim: { type: string }
                  key_id: { type: string }
                  issued_at: { type: string, description: 'UTC, YYYY-MM-DDTHH:MM:SS.mmmZ' }
                  valid_for_seconds: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or no registered officer key }
        '404': { description: No such revocation request for this application }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/revocation-requests/{revocation_id}/decision:
    post:
      summary: Record a registration officer's signed decision on a revocation request (laboratory, migrations 0031 and 0042)
      description: >-
        Requires the trust-registration-officer role and grant; the officer cannot be the one who asked. Once per request.
        Approval writes the core revocation, which the next CRL lists (ADR-0018, Proposed). Since migration 0042 the body
        carries the officer's DER ECDSA P-256 / SHA-256 signature over the claim from decision-claims, issued less than
        ten minutes ago; the API verifies it with the registered key in the recording transaction (422, nothing kept).
        The signer verifies it again before listing the serial (ADR-0029, Proposed). Incompatible change: unsigned
        decisions are refused (400).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: revocation_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, issued_at, signature_der_base64]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, minLength: 1, maxLength: 500 }
                issued_at: { type: string, description: The issued_at of the signed claim }
                signature_der_base64: { type: string, description: 'DER ECDSA signature, base64, 8 to 80 bytes' }
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, application_id, revocation_id, status, revoked_at]
                properties:
                  ca_id: { type: string, format: uuid }
                  application_id: { type: string, format: uuid }
                  revocation_id: { type: string, format: uuid }
                  status: { type: string, enum: [REVOKED, REJECTED] }
                  revoked_at: { type: [string, 'null'], format: date-time }
        '200': { description: Replay with the same Idempotency-Key }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or the officer asked for this revocation }
        '404': { description: No such revocation request for this application }
        '409': { description: 'Idempotency key reused, already decided, the claim expired, or (approval) the CA retired' }
        '422': { description: The signature does not verify with the officer's registered key over the claim; nothing recorded }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/void-proposal:
    post:
      summary: Propose to void an ambiguous issuance (laboratory, migration 0034)
      description: Requires the trust-registration-officer role and grant; the officer cannot be the application's requester. Only for an issuance left RECONCILIATION_REQUIRED, once per application. Records whether the signer had claimed the intent. Nothing is voided until another officer confirms (ADR-0020, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Proposal recorded
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, application_id, status, void_status, signer_claimed]
                properties:
                  ca_id: { type: string, format: uuid }
                  application_id: { type: string, format: uuid }
                  status: { type: string, enum: [RECONCILIATION_REQUIRED] }
                  void_status: { type: string, enum: [PROPOSED] }
                  signer_claimed: { type: boolean, description: Whether the signer had claimed the intent, so a certificate with the serial may exist }
        '200': { description: Replay with the same Idempotency-Key }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or the officer is the application's requester }
        '404': { description: No issuance for this application }
        '409': { description: Idempotency key reused, the issuance is not RECONCILIATION_REQUIRED, or a void was already proposed }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/void-confirmation-claims:
    post:
      summary: Prepare the claim the confirming officer signs (laboratory, migration 0042)
      description: >-
        Records nothing. Requires the trust-registration-officer role, a registration-officer grant and an active
        registered officer key. Returns trust-platform/void-authorization/v1 with the CA, application, serial (hex),
        whether the signer had claimed the intent, key and issued_at; valid 600 seconds (ADR-0029, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
                required: [decision, claim, key_id, issued_at, valid_for_seconds]
                properties:
                  decision: { type: string }
                  claim: { type: string }
                  key_id: { type: string }
                  issued_at: { type: string, description: 'UTC, YYYY-MM-DDTHH:MM:SS.mmmZ' }
                  valid_for_seconds: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or no registered officer key }
        '404': { description: No void proposed for this application }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/certificate-applications/{application_id}/void-confirmation:
    post:
      summary: Confirm a void proposal with a signed claim (laboratory, migrations 0034 and 0042)
      description: >-
        Requires the trust-registration-officer role and grant; the officer can be neither the proposer nor the
        application's requester. Once. The application becomes VOIDED; its serial is never reused and is listed, without
        reason code, on every CRL whose intent is fixed afterwards (ADR-0020, Proposed). Since migration 0042 the body
        carries the officer's signature over the claim from void-confirmation-claims; 422 and nothing kept when it does
        not verify. Incompatible change: unsigned confirmations are refused (400).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, issued_at, signature_der_base64]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                issued_at: { type: string, description: The issued_at of the signed claim }
                signature_der_base64: { type: string, description: 'DER ECDSA signature, base64, 8 to 80 bytes' }
      responses:
        '201':
          description: Issuance voided
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, application_id, status, serial_hex, voided_at]
                properties:
                  ca_id: { type: string, format: uuid }
                  application_id: { type: string, format: uuid }
                  status: { type: string, enum: [VOIDED] }
                  serial_hex: { type: string, pattern: '^[0-9a-f]+$' }
                  voided_at: { type: string, format: date-time }
        '200': { description: Replay with the same Idempotency-Key }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant, or the officer proposed this void or requested the application }
        '404': { description: No issuance, or no void proposed for it }
        '409': { description: 'Idempotency key reused, already voided, or the claim expired' }
        '422': { description: The signature does not verify with the officer's registered key over the claim; nothing recorded }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/crls:
    get:
      summary: List the CA's published CRLs, newest first, at most 100 (laboratory, migration 0031)
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: Published CRLs
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/PublishedCrl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing reader role or CA outside the signed scope }
        '503': { description: The database is unavailable }
    post:
      summary: Publish a CRL signed by the laboratory signer (laboratory, migration 0031)
      description: "Requires the trust-registration-officer role and grant; the CA in scope, ACTIVE or SUSPENDED. The database allocates the next CRL number and fixes the instant whose revocations the CRL lists; the API journals the TBS digest before the signer is called; the signer rebuilds the CRL from the database's own entries, claims the intent once and signs; the API verifies the CRL before it is stored. A number is never reused. v2 CRL, ecdsa-with-SHA256, nextUpdate seven days after thisUpdate, AKI and CRL number, reasonCode per entry unless unspecified (ADR-0018, Proposed)."
      parameters:
        - $ref: '#/components/parameters/CaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrlPublication' }
        '200':
          description: Published before under this Idempotency-Key; the PEM is not returned again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrlPublication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing role, scope or grant }
        '409': { description: Idempotency key reused, the CA neither issues nor publishes, or this intent was already journaled or superseded }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '502':
          description: The signing outcome is ambiguous; the intent is RECONCILIATION_REQUIRED and the next CRL takes a new number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrlPublication' }
        '503': { description: No laboratory signer socket is configured, or the database is unavailable }
  /v1/cas/{ca_id}/crl-status:
    get:
      summary: Where the CA's CRLs are published and whether renewal is due (laboratory, migration 0032)
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: CRL publication status
          content:
            application/json:
              schema:
                type: object
                required: [ca_id, distribution_point, latest_crl_number, next_update, renewal_due, expired, auto_renewal, publish_on_revocation, unpublished_entries]
                properties:
                  ca_id: { type: string, format: uuid }
                  distribution_point: { type: [string, 'null'], description: The public URL certificates carry, once the owner configured publication }
                  latest_crl_number: { type: [integer, 'null'] }
                  next_update: { type: [string, 'null'], format: date-time }
                  renewal_due: { type: boolean, description: No CRL yet, or nextUpdate within two days }
                  expired: { type: boolean, description: The latest CRL's nextUpdate has passed }
                  auto_renewal: { type: boolean, description: 'The API''s renewal task publishes this CA''s CRL when it is due (migration 0035, ADR-0021); the database owner grants it per CA' }
                  publish_on_revocation: { type: boolean, description: 'The database owner set this CA to publish a CRL as soon as a revocation or void is recorded; it takes effect through the renewer (migration 0040, ADR-0027)' }
                  unpublished_entries: { type: integer, minimum: 0, description: 'Revocations and voided serials not yet listed on the latest published CRL' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing reader role or CA outside the signed scope }
        '404': { description: Not a lifecycle-managed CA granted to the reader }
        '503': { description: The database is unavailable }
  /v1/ra/cas/{ca_id}/certificates:
    post:
      summary: Issue a certificate for a registered RA system's signed request (laboratory, migration 0038)
      description: >-
        No OIDC token. The request is authenticated by the RA's ECDSA P-256 signature (DER, SHA-256) over
        trust_pki_core::ra_request::ra_issuance_message (ra_id, CA, profile, request_id, SHA-256 of the CSR DER,
        DNS names in order, validity, signed_at), with the public key the database owner registered. The RA has
        validated the subscriber and the names (ADR-0024); the CA still applies the profile (zones, count,
        validity, key) and issues once through the journaled signer (ADR-0025, Proposed). signed_at must be
        within 300 seconds of the server clock. Version 1 (no subject_cn): the first DNS name is the subject CN,
        and the CSR must name it. Version 2 (subject_cn present, migration 0041, ADR-0028): the RA signs
        ra_issuance_message_v2, which adds the subject CN it chose among the DNS names and the optional
        extensions; the CSR is checked for proof of possession only, so the RA can correct its subject. An
        extension must be allowed by the database owner for the profile on this CA (422 otherwise). The
        laboratory signer verifies the RA's signature again before it signs.
      security: []
      parameters:
        - { in: path, name: ca_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ra_id, request_id, profile_id, csr_der_base64, dns_names, validity_days, signed_at, signature_der_base64]
              properties:
                ra_id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                request_id: { type: string, format: uuid, description: The RA's idempotency key }
                profile_id: { type: string }
                csr_der_base64: { type: string, description: PKCS#10 DER, base64 }
                dns_names: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
                validity_days: { type: integer, minimum: 1, maximum: 825 }
                signed_at: { type: integer, format: int64, description: Unix seconds }
                signature_der_base64: { type: string }
                subject_cn: { type: string, description: 'Version 2: the subject CN, one of dns_names' }
                extensions:
                  type: array
                  maxItems: 1
                  items: { type: string, enum: [client-auth] }
                  description: 'Version 2 only: optional extensions, in catalogue order (client-auth adds the TLS client EKU)'
      responses:
        '201': { description: Issued; the body carries the certificate PEM, serial and SHA-256 }
        '200': { description: The same signed request again; the same certificate }
        '400': { description: Malformed body, identifiers or names }
        '401': { description: Unknown or disabled RA, stale request, or a signature that does not verify }
        '403': { description: The profile is not granted to this RA for this CA }
        '409': { description: The request_id was used for other signed bytes, or an intent already exists }
        '422': { description: 'The CSR or the names do not fit the profile (zones, count, validity, key), or an extension the profile does not allow' }
        '502': { description: The signing outcome is ambiguous; the request needs reconciliation (ADR-0020) }
        '503': { description: No writer login or signer configured, or the database is unavailable }
  /v1/ra/cas/{ca_id}/revocations:
    post:
      summary: Revoke a certificate the signing RA obtained through the RA channel (laboratory, migration 0039)
      description: >-
        No OIDC token. Authenticated like the issuance route, by the RA's ECDSA P-256 signature over
        trust_pki_core::ra_request::ra_revocation_message (ra_id, CA, request_id, serial, reason code, reason,
        signed_at) with its registered key, within 300 seconds. Only certificates this RA obtained through
        /v1/ra/cas/{ca_id}/certificates. The signed request is both the revocation request and its approval
        (ADR-0026, Proposed); the revocation appears on the next CRL.
      security: []
      parameters:
        - { in: path, name: ca_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ra_id, request_id, serial_hex, reason_code, reason, signed_at, signature_der_base64]
              properties:
                ra_id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
                request_id: { type: string, format: uuid, description: The RA's idempotency key }
                serial_hex: { type: string, pattern: '^([0-9a-fA-F]{2}){1,20}$' }
                reason_code: { type: integer, enum: [0, 1, 3, 4, 5, 9], description: RFC 5280 reason code }
                reason: { type: string, minLength: 1, maxLength: 500 }
                signed_at: { type: integer, format: int64 }
                signature_der_base64: { type: string }
      responses:
        '201': { description: Revoked; the body carries the revocation instant }
        '200': { description: The same signed request again; the same revocation }
        '400': { description: Malformed body or a reason code outside the closed list }
        '401': { description: Unknown or disabled RA, stale request, or a signature that does not verify }
        '404': { description: This RA obtained no certificate with that serial from this CA }
        '409': { description: Already revoked, a revocation request open, the request_id used for other bytes, or the CA retired }
        '503': { description: No writer login configured, or the database is unavailable }
  /v1/cas/{ca_id}/crls/{crl_number}:
    get:
      summary: Read one published CRL as DER (laboratory, migration 0031)
      parameters:
        - $ref: '#/components/parameters/CaId'
        - { in: path, name: crl_number, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The CRL exactly as stored
          content:
            application/pkix-crl:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing reader role or CA outside the signed scope }
        '404': { description: No such published CRL for this CA }
        '503': { description: The database is unavailable }
  /v1/cas/{ca_id}/certificates:
    get:
      summary: Read one ordered page of certificate metadata for a scoped CA, at most 100
      parameters:
        - $ref: '#/components/parameters/CaId'
        - $ref: '#/components/parameters/HistoryCursor'
        - $ref: '#/components/parameters/CertificateCnPrefix'
        - $ref: '#/components/parameters/CertificateSanDns'
        - $ref: '#/components/parameters/CertificateNotAfterBefore'
        - $ref: '#/components/parameters/HistoryOrder'
      responses:
        '200':
          description: Metadata only; certificate DER is not exposed. Repeat with X-Next-Cursor until the header is absent.
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent on the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/certificates/{request_id}:
    get:
      summary: Read one certificate metadata record in a scoped CA
      description: Returns metadata only after checking the signed CA scope and current server-owned reader grant. Certificate DER is not exposed.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Certificate metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No certificate metadata for that request in the authorized CA }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/certificates/by-serial/{serial_hex}:
    get:
      summary: Find one certificate metadata record by issuer-scoped hexadecimal serial
      description: Accepts positive hexadecimal serials as plain digits, optionally prefixed with 0x or written as colon-separated byte pairs, case-insensitively. The input is normalized to minimal positive DER-content hex before lookup; the response serial_hex is canonical. Decimal notation is not accepted. The signed CA scope and current server-owned reader grant are checked before the restricted metadata view is queried. Certificate DER is not exposed.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: serial_hex
          required: true
          schema: { type: string, pattern: '^(?:0[xX])?(?:[0-9A-Fa-f]{1,40}|[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){1,19})$', maxLength: 61 }
      responses:
        '200':
          description: Certificate metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No certificate with that serial in the authorized CA }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/audit:
    get:
      summary: Read one ordered page of audit event metadata for a scoped CA, at most 100
      parameters:
        - $ref: '#/components/parameters/CaId'
        - $ref: '#/components/parameters/HistoryCursor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditUntil'
        - $ref: '#/components/parameters/AuditEventType'
        - $ref: '#/components/parameters/AuditDecision'
        - $ref: '#/components/parameters/AuditPolicyVersion'
        - $ref: '#/components/parameters/HistoryOrder'
      responses:
        '200':
          description: Audit metadata without actor identifiers. Repeat with X-Next-Cursor until the header is absent.
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent on the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/audit/{event_id}:
    get:
      summary: Read one audit event metadata record in a scoped CA
      description: Returns the limited audit projection after checking signed CA scope and current server-owned reader grant. Actor identifiers are not exposed.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Audit event metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No audit event metadata for that identifier in the authorized CA }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 OIDC access token with typ at+jwt, approved azp client ID, explicit ca_ids and the client-specific human trust-ca-reader or workload trust-ca-workload-reader role; issuer/subject/CA must also have a server-managed grant.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: "A UUID chosen by the client for this change. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
      schema: { type: string, format: uuid }
    CaId:
      in: path
      name: ca_id
      required: true
      schema: { type: string, format: uuid }
    HistoryCursor:
      in: query
      name: before
      required: false
      description: Pass the previous page's X-Next-Cursor unchanged. Malformed values, including impossible calendar times, return 400.
      schema: { type: string, maxLength: 61 }
    HistoryOrder:
      in: query
      name: order
      required: false
      description: Newest (default) or oldest timestamp and ID order over the full scoped history. Keep the same order on every cursor page.
      schema: { type: string, enum: [newest, oldest] }
    CertificateCnPrefix:
      in: query
      name: cn
      required: false
      description: Case-insensitive literal CN prefix over the selected CA's full history. Percent, underscore and backslash are escaped as literals. Keep the same prefix on every page.
      schema: { type: string, minLength: 2, maxLength: 255 }
    CertificateSanDns:
      in: query
      name: san_dns
      required: false
      description: Exact, case-insensitive ASCII DNS SAN over metadata recorded after independent certificate verification. Historical null SANs do not match. May be combined with cn; keep both filters on each cursor page.
      schema: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9.*_-]+$' }
    CertificateNotAfterBefore:
      in: query
      name: not_after_before
      required: false
      description: Exclusive UTC cutoff for recorded X.509 notAfter metadata. Historical null dates do not match. This is not a trust or revocation decision. Keep the cutoff on each cursor page.
      schema: { type: string, maxLength: 24, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$' }
    AuditFrom:
      in: query
      name: from
      required: false
      description: Inclusive UTC timestamp in YYYY-MM-DDTHH:mm:ss.SSSZ format; keep it on each cursor page.
      schema: { type: string, minLength: 24, maxLength: 24, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$' }
    AuditUntil:
      in: query
      name: until
      required: false
      description: Exclusive UTC timestamp in YYYY-MM-DDTHH:mm:ss.SSSZ format; must follow from and remain on each cursor page.
      schema: { type: string, minLength: 24, maxLength: 24, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$' }
    AuditEventType:
      in: query
      name: event_type
      required: false
      description: Exact event type in the selected CA's full audit history, trimmed and limited to 128 UTF-8 bytes with no control characters; keep on each cursor page.
      schema: { type: string, minLength: 1, maxLength: 128, x-utf8-max-bytes: 128 }
    AuditDecision:
      in: query
      name: decision
      required: false
      description: Exact decision in the selected CA's full audit history, trimmed and limited to 128 UTF-8 bytes with no control characters; keep on each cursor page.
      schema: { type: string, minLength: 1, maxLength: 128, x-utf8-max-bytes: 128 }
    AuditPolicyVersion:
      in: query
      name: policy_version
      required: false
      description: Exact non-null policy version in the selected CA's full audit history, trimmed and limited to 128 UTF-8 bytes with no control characters; keep on each cursor page.
      schema: { type: string, minLength: 1, maxLength: 128, x-utf8-max-bytes: 128 }
    CaCursor:
      in: query
      name: after
      required: false
      description: Pass the previous CA page's opaque X-Next-Cursor unchanged. It carries the last displayed name and CA identifier, so paging can continue if that CA's grant is revoked. Malformed values return 400; concurrent renames or inserts do not form a snapshot.
      schema: { type: string, maxLength: 4096 }
    CaSearch:
      in: query
      name: q
      required: false
      description: Case-insensitive literal prefix of CA display name or policy version over all signed and granted CAs. Keep this query on subsequent cursor pages.
      schema: { type: string, minLength: 2, maxLength: 255 }
  schemas:
    CA:
      type: object
      required: [ca_id, parent_ca_id, display_name, policy_version, created_at, operational_state]
      properties:
        ca_id: { type: string, format: uuid }
        parent_ca_id: { type: [string, 'null'], format: uuid }
        operational_state: { type: [string, 'null'], enum: [ACTIVE, SUSPENDED, RETIRED, null], description: For a CA activated through the CA lifecycle (migration 0028); null for a CA the owner created directly. }
        display_name: { type: string }
        policy_version: { type: string }
        created_at: { type: string, format: date-time }
    ProfileDraft:
      type: object
      required: [ca_id, profile_id, revision, display_name, policy_version, max_validity_days, max_dns_sans, proposed_dns_zones, proposed_signature_suites, created_by, created_at, status, submitted_at, approval_count, decided_at, activated_at, ended_at, proposal_warnings, snapshot_sha256]
      properties:
        ca_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer, minimum: 1 }
        display_name: { type: string }
        policy_version: { type: string }
        max_validity_days: { type: integer }
        max_dns_sans: { type: integer }
        proposed_dns_zones: { type: array, items: { type: string } }
        proposed_signature_suites: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, ACTIVE, SUPERSEDED, RETIRED]
          description: SUBMITTED revisions await two signed approvals; an operator activates an APPROVED revision, which a later activation supersedes or a retirement ends. No issuance path reads ACTIVE yet, so no state authorizes issuance.
        submitted_at: { type: [string, 'null'], format: date-time, description: Submission time; null for a DRAFT }
        approval_count: { type: integer, minimum: 0, maximum: 2, description: Signed approvals recorded for this revision }
        decided_at: { type: [string, 'null'], format: date-time, description: Time of the deciding decision; null before a revision is approved or rejected }
        activated_at: { type: [string, 'null'], format: date-time, description: Activation time; null unless ACTIVE, SUPERSEDED or RETIRED }
        ended_at: { type: [string, 'null'], format: date-time, description: Supersession or retirement time; null unless SUPERSEDED or RETIRED }
        proposal_warnings:
          type: array
          description: Advisory syntax findings only. An empty array is not an approval, provider capability check or issuance authorization.
          items: { type: string, enum: [blank_display_name, blank_policy_version, invalid_dns_zone, duplicate_dns_zone, invalid_suite_id, duplicate_suite_id] }
        snapshot_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the v1 length-prefixed proposal-policy envelope. It is not signed, approved or bound to an issued certificate.
    ProfileDraftCreate:
      type: object
      additionalProperties: false
      required: [profile_id, display_name, policy_version, max_validity_days, max_dns_sans, proposed_dns_zones, proposed_signature_suites]
      properties:
        profile_id: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        display_name: { type: string, minLength: 1, maxLength: 255 }
        policy_version: { type: string, minLength: 1, maxLength: 128 }
        max_validity_days: { type: integer, minimum: 1, maximum: 825 }
        max_dns_sans: { type: integer, minimum: 1, maximum: 100 }
        proposed_dns_zones: { type: array, minItems: 1, maxItems: 32, items: { type: string, maxLength: 253 } }
        proposed_signature_suites: { type: array, minItems: 1, maxItems: 16, items: { type: string, maxLength: 64 } }
    ProfileActivation:
      type: object
      required: [ca_id, profile_id, revision, status, superseded_revision]
      properties:
        ca_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        superseded_revision: { type: [integer, 'null'], description: The revision this activation superseded; null when none was active, and for a retirement }
    ProfileDecision:
      type: object
      required: [ca_id, profile_id, revision, decision, status, approval_count]
      properties:
        ca_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approve, reject] }
        status: { type: string, enum: [SUBMITTED, APPROVED, REJECTED] }
        approval_count: { type: integer, minimum: 0, maximum: 2 }
    ProfileSubmission:
      type: object
      required: [ca_id, profile_id, revision, status, snapshot_sha256, submitted_at]
      properties:
        ca_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { type: string, const: SUBMITTED }
        snapshot_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        submitted_at: { type: string, format: date-time }
    CaProposal:
      type: object
      required: [ca_id, display_name, policy_version, suite_id, lifecycle_status, proposed_at, certificate_sha256, spki_sha256, not_before, not_after, custody, registered_at, approval_count, decided_at, activated_at, state_changed_at, change_request_id, change_action, change_status, change_approval_count, change_reason]
      properties:
        ca_id: { type: string, format: uuid }
        display_name: { type: string }
        policy_version: { type: string }
        suite_id: { type: string }
        lifecycle_status: { type: string, enum: [PROPOSED, KEY_ATTESTED, APPROVED, REJECTED, ACTIVE, SUSPENDED, RETIRED], description: ACTIVE, SUSPENDED and RETIRED are CAs (their operational state); no state authorizes issuance yet. }
        proposed_at: { type: string, format: date-time }
        certificate_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        spki_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        not_before: { type: [string, 'null'], format: date-time }
        not_after: { type: [string, 'null'], format: date-time }
        custody: { type: [string, 'null'], enum: [lab-software-file, null], description: A software key file; not custody evidence. }
        registered_at: { type: [string, 'null'], format: date-time }
        approval_count: { type: integer, minimum: 0, maximum: 2 }
        decided_at: { type: [string, 'null'], format: date-time, description: Time of the deciding decision; null before APPROVED or REJECTED }
        activated_at: { type: [string, 'null'], format: date-time }
        state_changed_at: { type: [string, 'null'], format: date-time }
        change_request_id: { type: [string, 'null'], format: uuid, description: The open or approved reactivation or retirement request, if any }
        change_action: { type: [string, 'null'], enum: [reactivate, retire, null] }
        change_status: { type: [string, 'null'], enum: [OPEN, APPROVED, null] }
        change_approval_count: { type: [integer, 'null'], minimum: 0, maximum: 2 }
        change_reason: { type: [string, 'null'] }
    CertificateApplication:
      type: object
      required: [application_id, ca_id, profile_id, revision, csr_sha256, subject_cn, dns_names, validity_days, status, decision_reason, submitted_at, decided_at, certificate_serial_hex, certificate_sha256, certificate_request_id, open_revocation_id, open_revocation_reason_code, revocation_reason_code, revoked_at, void_status, void_signer_claimed, void_proposed_by_reader, void_serial_hex, voided_at]
      properties:
        application_id: { type: string, format: uuid }
        ca_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer }
        csr_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        subject_cn: { type: string }
        dns_names: { type: array, items: { type: string } }
        validity_days: { type: integer }
        status:
          type: string
          enum: [SUBMITTED, APPROVED, REJECTED, ISSUING, ISSUED, RECONCILIATION_REQUIRED, REVOCATION_REQUESTED, REVOKED, VOIDED]
          description: ISSUING while an intent is open; RECONCILIATION_REQUIRED when the signing outcome was ambiguous (never signed again) (migration 0030); REVOCATION_REQUESTED while a revocation request is open, REVOKED once approved (migration 0031); VOIDED once two officers voided an ambiguous issuance (migration 0034).
        decision_reason: { type: [string, 'null'] }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        certificate_serial_hex: { type: [string, 'null'], pattern: '^[0-9a-f]+$', description: Set once ISSUED }
        certificate_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Set once ISSUED }
        certificate_request_id: { type: [string, 'null'], format: uuid, description: The core issuance request, once issuance started }
        open_revocation_id: { type: [string, 'null'], format: uuid, description: The open revocation request, if any }
        open_revocation_reason_code: { type: [integer, 'null'], enum: [0, 1, 3, 4, 5, 9, null] }
        revocation_reason_code: { type: [integer, 'null'], enum: [0, 1, 3, 4, 5, 9, null], description: RFC 5280 reason of the core revocation }
        revoked_at: { type: [string, 'null'], format: date-time }
        void_status: { type: [string, 'null'], enum: [PROPOSED, VOIDED, null], description: Reconciliation of an ambiguous issuance (migration 0034) }
        void_signer_claimed: { type: [boolean, 'null'], description: Whether the signer had claimed the intent when the void was proposed }
        void_proposed_by_reader: { type: [boolean, 'null'], description: Whether the caller proposed the void; the other officer is never named }
        void_serial_hex: { type: [string, 'null'], pattern: '^[0-9a-f]+$', description: The serial that is voided and listed on later CRLs }
        voided_at: { type: [string, 'null'], format: date-time }
    PublishedCrl:
      type: object
      required: [ca_id, crl_number, this_update, next_update, crl_sha256, published_at, entry_count]
      properties:
        ca_id: { type: string, format: uuid }
        crl_number: { type: integer, minimum: 1 }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        crl_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        published_at: { type: string, format: date-time }
        entry_count: { type: integer, minimum: 0 }
    CrlPublication:
      type: object
      required: [ca_id, crl_number, status, this_update, next_update, entry_count, crl_sha256, crl_pem]
      properties:
        ca_id: { type: string, format: uuid }
        crl_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [PUBLISHED, RECONCILIATION_REQUIRED] }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        entry_count: { type: [integer, 'null'] }
        crl_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        crl_pem: { type: [string, 'null'], description: Only on the 201 that published it }
    CertificateIssuance:
      type: object
      required: [ca_id, application_id, status, certificate_pem, serial_hex, certificate_sha256]
      properties:
        ca_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        status: { type: string, enum: [ISSUED, RECONCILIATION_REQUIRED] }
        certificate_pem: { type: [string, 'null'], description: Only on the 201 that issued it }
        serial_hex: { type: [string, 'null'], pattern: '^[0-9a-f]+$' }
        certificate_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    CertificateApplicationSubmitted:
      type: object
      required: [ca_id, application_id, profile_id, revision, status, csr_sha256]
      properties:
        ca_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        profile_id: { type: string }
        revision: { type: integer, description: The active revision the application is bound to }
        status: { type: string, enum: [SUBMITTED, APPROVED, REJECTED] }
        csr_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CaOperationalState:
      type: object
      required: [ca_id, operational_state]
      properties:
        ca_id: { type: string, format: uuid }
        operational_state: { type: string, enum: [ACTIVE, SUSPENDED, RETIRED] }
        retired_revisions: { type: integer, minimum: 0, description: Present on application; active profile revisions retired with the CA }
    CaChangeRequested:
      type: object
      required: [ca_id, request_id, action, from_state]
      properties:
        ca_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        action: { type: string, enum: [reactivate, retire] }
        from_state: { type: string, enum: [ACTIVE, SUSPENDED] }
    CaChangeDecisionRecorded:
      type: object
      required: [ca_id, request_id, decision, request_status, approval_count]
      properties:
        ca_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        request_status: { type: string, enum: [OPEN, APPROVED, REJECTED] }
        approval_count: { type: integer, minimum: 0, maximum: 2 }
    CaDecisionRecorded:
      type: object
      required: [ca_id, decision, lifecycle_status, approval_count]
      properties:
        ca_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        lifecycle_status: { type: string, enum: [KEY_ATTESTED, APPROVED, REJECTED] }
        approval_count: { type: integer, minimum: 0, maximum: 2 }
    CaActivated:
      type: object
      required: [ca_id, lifecycle_status, suite_id]
      properties:
        ca_id: { type: string, format: uuid }
        lifecycle_status: { type: string, enum: [ACTIVE] }
        suite_id: { type: string }
    CaProposalCreated:
      type: object
      required: [ca_id, lifecycle_status, proposed_at]
      properties:
        ca_id: { type: string, format: uuid }
        lifecycle_status: { type: string, enum: [PROPOSED] }
        proposed_at: { type: string, format: date-time }
    CaIssuerCertificateRegistered:
      type: object
      required: [ca_id, lifecycle_status, certificate_sha256]
      properties:
        ca_id: { type: string, format: uuid }
        lifecycle_status: { type: string, enum: [KEY_ATTESTED] }
        certificate_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Certificate:
      type: object
      required: [ca_id, serial_hex, fingerprint_sha256, request_id, state, signed_at, published_at, subject_cn, not_before, not_after, san_dns, revoked_at, revocation_reason]
      properties:
        ca_id: { type: string, format: uuid }
        serial_hex: { type: string }
        fingerprint_sha256: { type: string }
        request_id: { type: string, format: uuid }
        state: { type: string }
        signed_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        subject_cn: { type: [string, 'null'], description: Recorded subject CN when available; null for historical or unsupported subjects. Disposable lab fixtures may use synthetic values. }
        not_before: { type: [string, 'null'], format: date-time, description: Validity start parsed from independently verified certificate DER; null for historical records. }
        not_after: { type: [string, 'null'], format: date-time, description: Validity end parsed from independently verified certificate DER; null for historical records. }
        san_dns: { type: [array, 'null'], items: { type: string }, description: DNS SANs parsed from independently verified certificate DER; empty when no DNS SAN exists, null for historical records. }
        revoked_at: { type: [string, 'null'], format: date-time, description: 'When an approved revocation of this certificate was recorded (migration 0033); null when none is recorded. The issuance state is unchanged; relying parties learn of the revocation from the next published CRL.' }
        revocation_reason: { type: [integer, 'null'], minimum: 0, maximum: 10, description: RFC 5280 CRLReason code of the recorded revocation; null when none is recorded. }
    AuditEvent:
      type: object
      required: [event_id, ca_id, event_type, decision, policy_version, recorded_at]
      properties:
        event_id: { type: string, format: uuid }
        ca_id: { type: string, format: uuid }
        event_type: { type: string }
        decision: { type: string }
        policy_version: { type: [string, 'null'] }
        recorded_at: { type: string, format: date-time }
        chain_sealed: { type: boolean, description: 'Whether the event is sealed into the tamper-evident audit chain (migration 0036, ADR-0022). Integrity is proven only by the independent verification tool against a head exported earlier; the global sequence and hashes are not exposed to readers.' }
  responses:
    BadRequest: { description: Invalid identifier or cursor }
    Unauthorized: { description: Missing or invalid access token }
    Forbidden: { description: Role, signed CA scope or server-managed grant denied }
    Unavailable: { description: Management data request capacity exhausted or read database unavailable }
