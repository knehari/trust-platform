          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [reactivate, retire] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Change requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaChangeRequested' }
        '200':
          description: Replay with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaChangeRequested' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or ca-administrator platform grant }
        '404': { description: No such activated CA }
        '409': { description: Idempotency key reused, the action does not apply to the CA's state, the CA is RETIRED, or an open request exists }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/change-requests/{request_id}/decision-claims:
    post:
      summary: Obtain the exact change decision claim to sign (laboratory, migration 0028)
      description: "Records nothing. As for CA decision claims (ADR-0014), with the claim trust-platform/ca-change-decision/v1 binding the action, request, state it was made in, reason digest and certificate. The requester cannot decide (ADR-0015, Proposed)."
      parameters:
