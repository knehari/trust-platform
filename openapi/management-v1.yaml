openapi: 3.1.0
info:
  title: Sovereign Trust Platform management API
  version: 0.1.0-lab
  description: Read-only laboratory API. No issuance or production qualification is implied. Every HTTP response carries Cache-Control no-store and a generated X-Request-Id header for diagnostic correlation; it is not signed audit evidence.
servers:
  - url: http://127.0.0.1:8081
security:
  - oidcAccessToken: []
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness without sensitive details
      responses:
        '200':
          description: Process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: up
  /v1/ready:
    get:
      security: []
      summary: Readiness of the restricted PostgreSQL management read path
      description: Checks the restricted reader role and required views without returning metadata or database errors. Uses one separate probe slot and a one-second result cache; a busy authenticated-read budget or concurrent probe returns 503.
      responses:
        '200':
          description: Management reads can be served
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ready
        '503':
          description: Management reads are unavailable
  /v1/cas:
    get:
      summary: List one ordered page of CAs in both the signed scope and server-managed reader grants, at most 100
      parameters:
        - $ref: '#/components/parameters/CaCursor'
        - $ref: '#/components/parameters/CaSearch'
      responses:
        '200':
          description: Scoped CA list. Repeat with X-Next-Cursor until the header is absent.
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent on the final page.
              schema: { type: string, maxLength: 4096 }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CA'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}:
    get:
      summary: Read one scoped CA
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: CA detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CA'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/profile-drafts:
    get:
      summary: List inert profile-draft revisions for one scoped CA, at most 100 per page
      description: Draft records are unapproved proposals and cannot authorize issuance. Both signed CA scope and the current server-managed reader grant are required.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: query
          name: profile_id
          required: false
          description: Exact lowercase profile ID. Keep this filter on each cursor page; a cursor for another profile returns 400.
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: query
          name: q
          required: false
          description: Case-insensitive literal prefix of profile ID, display name or policy version across the authorized CA history. Percent, underscore and backslash are escaped as literals. Keep this query on every cursor page.
          schema: { type: string, minLength: 2, maxLength: 255 }
        - in: query
          name: policy_version
          required: false
          description: Exact policy version across the authorized CA history, trimmed and limited to 128 Unicode characters with no control characters, matching the stored proposal field; keep it on every cursor page.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: from
          required: false
          description: Inclusive recorded-at UTC timestamp in YYYY-MM-DDTHH:mm:ss.SSSZ format; keep it on every cursor page.
          schema: { type: string, minLength: 24, maxLength: 24, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$' }
        - in: query
          name: until
          required: false
          description: Exclusive recorded-at UTC timestamp in the same format; it must follow from and remain on every cursor page.
          schema: { type: string, minLength: 24, maxLength: 24, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$' }
        - in: query
          name: min_validity_days
          required: false
          description: Minimum proposed maximum certificate validity in days across the authorized CA history; informational only and not an issuance grant. Keep on every cursor page.
          schema: { type: integer, minimum: 1, maximum: 825 }
        - in: query
          name: min_dns_sans
          required: false
          description: Minimum proposed maximum DNS SAN count across the authorized CA history; informational only and not an issuance grant. Keep on every cursor page.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: order
          required: false
          description: Oldest (default) or newest revision first. Newest requires profile_id. Keep this order on each cursor page.
          schema: { type: string, enum: [oldest, newest] }
        - in: query
          name: after
          required: false
          description: Pass X-Next-Cursor from the preceding page unchanged, with the same filters and order; malformed cursors return 400.
          schema: { type: string, maxLength: 72 }
      responses:
        '200':
          description: Profile-draft revisions ordered by profile ID and revision; a filtered profile may be ordered by revision descending.
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent on the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileDraft'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      summary: Record the next immutable DRAFT revision of a profile (laboratory, migration 0022)
      description: Requires the trust-profile-editor token role, the CA in the signed scope and a server-owned profile-editor grant; the reader role is not required. The server assigns the next revision number, records a lifecycle event and an audit event, and never approves or activates anything. Writes go through a database login that can only execute the lifecycle functions (ADR-0010, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: header
          name: Idempotency-Key
          required: true
          description: "A UUID chosen by the client for this change. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileDraftCreate' }
      responses:
        '201':
          description: Revision recorded as a DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDraft' }
        '200':
          description: Replay of a recorded request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-profile-editor role, CA outside the signed scope, or no server-owned profile-editor grant for this issuer, subject and CA }
        '409': { description: Idempotency key reused for another request, or a conflicting recorded state }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}:
    get:
      summary: Read one exact inert profile-draft revision in a scoped CA
      description: Rechecks the signed CA scope and current server-owned reader grant. The returned digest identifies proposed content; it is not an approval.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        '200':
          description: One exact revision in any lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDraft'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such revision in the authorized CA }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}/submission:
    post:
      summary: Submit the latest revision of a profile for approval (laboratory, migration 0022)
      description: Same role and grant requirements as recording a revision. Only the latest revision can be submitted, once, and only when the request names its exact digest, recomputed by the database. A revision with advisory syntax warnings is refused. SUBMITTED is not approval and cannot authorize issuance.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - in: header
          name: Idempotency-Key
          required: true
          description: "A UUID chosen by the client for this change. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_sha256]
              properties:
                snapshot_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '201':
          description: Revision submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSubmission' }
        '200':
          description: Replay of a recorded submission with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSubmission' }
        '404': { description: No such revision in the authorized CA }
        '422': { description: The revision has advisory syntax warnings; nothing was recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-profile-editor role, CA outside the signed scope, or no server-owned profile-editor grant for this issuer, subject and CA }
        '409': { description: Idempotency key reused, a newer revision exists, the revision is already submitted, or the digest does not match it }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}/decision-claims:
    post:
      summary: Get the exact claim an approver signs to approve or reject a submitted revision (laboratory, migration 0023)
      description: Records nothing. The database builds a one-line claim binding the decision, CA, profile, revision, submission digest and event, approver identity, registered key and issue time. It is valid for ten minutes. Sign it with the approver's own registered P-256 key outside the console (ECDSA with SHA-256, DER signature), for example with `openssl dgst -sha256 -sign`.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
                required: [decision, claim, key_id, issued_at, valid_for_seconds]
                properties:
                  decision: { type: string, enum: [approve, reject] }
                  claim: { type: string, pattern: '^trust-platform/profile-decision/v1;' }
                  key_id: { type: string }
                  issued_at: { type: string, format: date-time }
                  valid_for_seconds: { type: integer, const: 600 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-policy-approver role, CA outside the signed scope, no server-owned policy-approver grant, no active registered key, or the caller authored or submitted the revision }
        '404': { description: No such revision in the authorized CA }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
        '409': { description: The revision is not submitted, is already approved or rejected, or this approver already decided }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}/decisions:
    post:
      summary: Record a signed approval or rejection of a submitted revision (laboratory, migration 0023)
      description: The API rebuilds the claim in the database and verifies the signature with the approver's registered key inside the transaction that records it; a signature that does not verify is refused and nothing is kept. Two approvals by distinct approvers with distinct keys make the revision APPROVED; one rejection makes it REJECTED. APPROVED does not activate the profile or authorize issuance (ADR-0011, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - in: header
          name: Idempotency-Key
          required: true
          description: "A UUID chosen by the client for this decision. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, issued_at, signature_der_base64]
              properties:
                decision: { type: string, enum: [approve, reject] }
                issued_at: { type: string, format: date-time, description: The issued_at of the claim that was signed }
                signature_der_base64: { type: string, description: Base64 of the DER ECDSA P-256/SHA-256 signature over the exact claim bytes }
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDecision' }
        '200':
          description: Replay of a recorded decision with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-policy-approver role, CA outside the signed scope, no server-owned policy-approver grant, no active registered key, or the caller authored or submitted the revision }
        '404': { description: No such revision in the authorized CA }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
        '409': { description: Idempotency key reused, claim expired or not yet valid, revision not submitted or already decided, or this approver already decided }
        '422': { description: The signature does not verify over the claim with the approver's registered key; nothing was recorded }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}/activation:
    post:
      summary: Activate an approved revision (laboratory, migration 0024)
      description: The revision must be APPROVED and never activated, and the request names its exact digest. The CA's policy version must equal the revision's, every proposed suite must be declared for the CA by the owner and be in the typed algorithm catalogue. Any active revision of the profile becomes SUPERSEDED. No issuance path reads the active revision yet (ADR-0012, Proposed).
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - in: header
          name: Idempotency-Key
          required: true
          description: "A UUID chosen by the client for this change. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_sha256]
              properties:
                snapshot_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '201':
          description: Revision activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileActivation' }
        '200':
          description: Replay of a recorded activation with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileActivation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-operator role, CA outside the signed scope, no server-owned ca-operator grant, or (activation) the caller wrote, submitted or decided on the revision }
        '404': { description: No such revision in the authorized CA }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
        '409': { description: Idempotency key reused, the revision is not APPROVED or was already activated, or the digest does not match it }
        '422': { description: Incompatible with the CA (policy version, a suite the CA does not declare, or a suite outside the catalogue); nothing was recorded }
  /v1/cas/{ca_id}/profile-drafts/{profile_id}/{revision}/retirement:
    post:
      summary: Retire the active revision of a profile (laboratory, migration 0024)
      description: Only the ACTIVE revision can be retired, once. Nothing replaces it until another approved revision is activated. The body is an empty JSON object.
      parameters:
        - $ref: '#/components/parameters/CaId'
        - in: path
          name: profile_id
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', maxLength: 64 }
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - in: header
          name: Idempotency-Key
          required: true
          description: "A UUID chosen by the client for this change. Repeating the same request with the same key returns the recorded result (200, with header Idempotent-Replayed set to true); any other request with that key returns 409."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Revision retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileActivation' }
        '200':
          description: Replay of a recorded retirement with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileActivation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-operator role, CA outside the signed scope, no server-owned ca-operator grant, or (activation) the caller wrote, submitted or decided on the revision }
        '404': { description: No such revision in the authorized CA }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
        '409': { description: Idempotency key reused, or the revision is not the active one }
  /v1/ca-proposals:
    get:
      summary: List CA proposals (laboratory, migration 0026)
      description: Newest first, at most 100. Requires the trust-ca-administrator or trust-ca-approver role; the database returns rows only when the caller holds the matching owner-granted platform grant, and an empty list otherwise. Only an ACTIVE proposal is a CA, and no CA issues yet (ADR-0013, ADR-0014, Proposed).
      responses:
        '200':
          description: Proposals visible to the caller
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/CaProposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator and trust-ca-approver roles }
        '503': { description: The database is unavailable }
    post:
      summary: Propose a CA (laboratory, migration 0026)
      description: Records a PROPOSED CA. The database draws its identifier. Only the ecdsa-p256-sha256 suite can be proposed. No CA row, grant or issuance results (ADR-0013, Proposed).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, policy_version, suite_id]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 255, description: 'No control characters or surrounding spaces. The issuer certificate''s common name must equal it.' }
                policy_version: { type: string, minLength: 1, maxLength: 128 }
                suite_id: { type: string, enum: [ecdsa-p256-sha256] }
                ca_id: { type: string, format: uuid, description: 'Optional identifier chosen by the administrator (ADR-0016); one already used by a CA or proposal is refused (409). Drawn by the database when absent.' }
      responses:
        '201':
          description: Proposal recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaProposalCreated' }
        '200':
          description: Replay of a recorded proposal with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaProposalCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or no server-owned ca-administrator platform grant }
        '409': { description: Idempotency key reused for another request, or the chosen ca_id is already used }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422': { description: A suite other than ecdsa-p256-sha256 }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/issuer-certificate:
    post:
      summary: Register a proposal's self-signed issuer certificate (laboratory, migration 0026)
      description: "The private key is generated outside the platform; send only the certificate. The API accepts one PEM certificate in canonical DER: X.509 v3, ecdsa-with-SHA256, a P-256 named-curve key, a subject of exactly one common name equal to the issuer, only basicConstraints (critical, cA), keyUsage (critical, keyCertSign and cRLSign), subjectKeyIdentifier and authorityKeyIdentifier, a current validity, and a signature that verifies under its own key. The database then requires the common name to equal the proposal's display name, the key to match its suite, no earlier certificate for the proposal and no reuse of the public key. The proposal becomes KEY_ATTESTED (ADR-0013, Proposed)."
      parameters:
        - in: path
          name: ca_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificate_pem]
              properties:
                certificate_pem: { type: string, maxLength: 16000 }
      responses:
        '201':
          description: Certificate verified and recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaIssuerCertificateRegistered' }
        '200':
          description: Replay of a recorded registration with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaIssuerCertificateRegistered' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or no server-owned ca-administrator platform grant }
        '404': { description: No such proposal }
        '409': { description: Idempotency key reused, the proposal already has a certificate, or the public key is registered for another proposal }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422':
          description: "Certificate refused. When the API's verifier refuses it, the body names the first failed rule (reason: Encoding, Version, SignatureAlgorithm, KeyAlgorithm, Subject, NotSelfIssued, Extensions, BasicConstraints, KeyUsage, Validity or Signature); when the database refuses it (name, suite or validity mismatch), there is no body. Nothing was recorded."
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error: { type: string, enum: [certificate_refused] }
                  reason: { type: string }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/decision-claims:
    post:
      summary: Obtain the exact CA decision claim to sign (laboratory, migration 0027)
      description: "Records nothing. Requires the trust-ca-approver role, an owner-granted ca-approver platform grant and an active registered CA approver key. The proposal must be KEY_ATTESTED and undecided by the caller, who must not have proposed it or registered its certificate. The claim binds the certificate and key digests and is valid for ten minutes. Sign it outside the console, for example: printf '%s' '<claim>' | openssl dgst -sha256 -sign <key>.pem | openssl base64 -A (ADR-0014, Proposed)."
      parameters:
        - in: path
          name: ca_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: The claim to sign
          content:
            application/json:
              schema:
                type: object
                required: [decision, claim, key_id, issued_at, valid_for_seconds]
                properties:
                  decision: { type: string, enum: [approve, reject] }
                  claim: { type: string, pattern: '^trust-platform/ca-decision/v1;' }
                  key_id: { type: string }
                  issued_at: { type: string, format: date-time }
                  valid_for_seconds: { type: integer, enum: [600] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-approver role, no ca-approver grant, no active CA approver key, or the caller proposed the CA or registered its certificate }
        '404': { description: No such proposal }
        '409': { description: The proposal is not KEY_ATTESTED, is already decided, or the caller already decided }
        '415': { description: Content type is not application/json }
        '422': { description: The issuer certificate has expired }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/decisions:
    post:
      summary: Record a signed CA approval or rejection (laboratory, migration 0027)
      description: The database re-checks every rule and rebuilds the claim; the API verifies the DER ECDSA P-256/SHA-256 signature with the approver's registered CA key before commit. Two approvals by distinct approvers with distinct keys make the proposal APPROVED; one rejection makes it REJECTED, which is final (ADR-0014, Proposed).
      parameters:
        - in: path
          name: ca_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, issued_at, signature_der_base64]
              properties:
                decision: { type: string, enum: [approve, reject] }
                issued_at: { type: string, format: date-time, description: The issued_at of the signed claim }
                signature_der_base64: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaDecisionRecorded' }
        '200':
          description: Replay of a recorded decision with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaDecisionRecorded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: As for decision-claims }
        '404': { description: No such proposal }
        '409': { description: Idempotency key reused, claim expired or not yet valid, the proposal is not awaiting this decision }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422': { description: The signature does not verify over the claim with the approver's registered key, or the certificate has expired; nothing was recorded }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/activation:
    post:
      summary: Activate an approved CA proposal (laboratory, migration 0027)
      description: Requires the trust-ca-administrator role and the ca-administrator platform grant; the caller must not have decided on the proposal. The request names the approved certificate's SHA-256. The database creates the CA with the proposal's identifier, name and policy version and its attested suite as its only signing capability; the API verifies the stored certificate again and checks the suite against the catalogue before commit. No issuance path uses the CA yet, and readers see it only through owner-held reader grants (ADR-0014, Proposed).
      parameters:
        - in: path
          name: ca_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificate_sha256]
              properties:
                certificate_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '201':
          description: CA activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaActivated' }
        '200':
          description: Replay of a recorded activation with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaActivated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or grant, or the caller decided on the proposal }
        '404': { description: No such proposal }
        '409': { description: Idempotency key reused, the proposal is not APPROVED or was activated, the digest is not the approved certificate's, or a CA with this identifier exists }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '422': { description: The stored certificate has expired, no longer verifies, or its suite is not catalogued; nothing was activated }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/suspension:
    post:
      summary: Suspend an ACTIVE CA at once (laboratory, migration 0028)
      description: One administrator suffices. While SUSPENDED, no profile revision can be activated for the CA. Reactivation needs a change request (ADR-0015, Proposed).
      parameters:
        - { in: path, name: ca_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: No control characters or surrounding spaces. }
      responses:
        '201':
          description: CA suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaOperationalState' }
        '200':
          description: Replay with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaOperationalState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing trust-ca-administrator role or ca-administrator platform grant }
        '404': { description: No such activated CA }
        '409': { description: Idempotency key reused, or the CA is not ACTIVE }
        '413': { description: Request body above 16 KiB }
        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/change-requests:
    post:
      summary: Request reactivation or retirement of an activated CA (laboratory, migration 0028)
      description: reactivate applies to a SUSPENDED CA, retire to an ACTIVE or SUSPENDED one. One open request per CA; a request whose CA changed state since is stale and no longer blocks. Two CA approvers other than the requester must approve it, then an administrator who did not decide applies it (ADR-0015, Proposed).
      parameters:
        - { in: path, name: ca_id, required: true, schema: { type: string, format: uuid } }
