        '415': { description: Content type is not application/json }
        '503': { description: The write database login is not configured or the database is unavailable }
  /v1/ca-proposals/{ca_id}/change-requests/{request_id}/decisions:
    post:
      summary: Record a signed decision on a change request (laboratory, migration 0028)
      description: The API verifies the DER ECDSA P-256/SHA-256 signature with the approver's registered CA key before commit. Two approvals make the request APPROVED; one rejection makes it REJECTED (ADR-0015, Proposed).
