openapi: 3.1.0
info:
  title: Sovereign Trust Platform revocation write API
  version: 0.1.0-lab
  description: >-
    Laboratory signed status-change API (crates/management-api/src/bin/revocation_api.rs;
    ADR-0005 and ADR-0007, both Proposed). Only the signed maker-checker flow is
    offered. The acting officer is the verified access token's issuer and
    subject, never a request field. The token must carry the
    trust-revocation-officer role and the CA in ca_ids; the database still
    requires the officer grant and an enrolled WebAuthn credential. Each
    verified identity may make 60 requests per minute; beyond that every route
    answers 429 before any database access; request bodies over 64 KiB get 413. No production readiness is implied.
servers:
  - url: http://127.0.0.1:8083
security:
  - oidcAccessToken: []
paths:
  /v1/cas/{ca_id}/status-change-challenges:
    post:
      summary: Maker asks for a single-use challenge to propose a status change
      parameters:
        - $ref: '#/components/parameters/CaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serial_hex, action]
              properties:
                serial_hex:
                  type: string
                  description: Positive DER INTEGER content of the serial, lowercase or uppercase hex.
                action:
                  enum: [SUSPEND, RELEASE, REVOKE]
                reason:
                  type: integer
                  description: CRL reason code (0-6, 9, 10); omitted for RELEASE, 6 for SUSPEND.
                invalidity_unix:
                  type: integer
                  description: Optional invalidity date, seconds since the Unix epoch, not in the future.
      responses:
        '201': {$ref: '#/components/responses/Challenge'}
        '400': {description: Malformed serial, action, reason or body}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Non-canonical CA identifier}
        '409': {description: Refused by policy (status, open change, suspension, issuer not registered)}
        '422': {description: Unknown request field}
        '503': {description: Database unavailable or busy}
  /v1/status-changes/{change_id}/approval-challenges:
    post:
      summary: Checker asks for a single-use challenge to approve a proposed change
      parameters:
        - name: change_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/Challenge'}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Non-canonical change identifier}
        '409': {description: Closed change, or the checker is the maker}
        '503': {description: Database unavailable or busy}
  /v1/status-change-challenges/{challenge_id}/assertion:
    post:
      summary: Submit the WebAuthn assertion that signs the challenge's claim
      description: >-
        The Rust core verifies the ES256 assertion (RP id, user presence and
        verification, origin, ceremony type, challenge, counter, signature
        with the enrolled key) against the claim rebuilt from the database
        before anything is written. Only the officer the challenge was
        issued to may answer it.
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_id, authenticator_data, client_data_json, signature]
              properties:
                credential_id: {type: string, description: base64url, no padding}
                authenticator_data: {type: string, description: base64url, no padding}
                client_data_json: {type: string, description: base64url, no padding}
                signature: {type: string, description: DER ECDSA signature, base64url, no padding}
      responses:
        '200':
          description: Signed proposal recorded, or change approved and applied
          content:
            application/json:
              schema:
                type: object
                required: [change_id]
                properties:
                  change_id: {type: string, format: uuid}
        '400': {description: Malformed encoding or an assertion that does not verify}
        '401': {description: Missing or invalid access token}
        '403': {description: Challenge issued to another officer, or CA out of token scope}
        '409': {description: Challenge spent or expired, credential removed or not the officer's, distinctness or counter rule refused}
        '503': {description: Database unavailable or busy}
  /v1/cas/{ca_id}/pending-status-changes:
    get:
      summary: Proposed changes of a CA waiting for a checker (oldest first, at most 500)
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: Pending changes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [change_id, serial_hex, action, maker_issuer, maker_subject, proposed_at_unix, maker_signed]
                  properties:
                    change_id: {type: string, format: uuid}
                    serial_hex: {type: string}
                    action: {enum: [SUSPEND, RELEASE, REVOKE]}
                    reason: {type: [integer, 'null']}
                    invalidity_unix: {type: [integer, 'null']}
                    maker_issuer: {type: string}
                    maker_subject: {type: string}
                    proposed_at_unix: {type: integer}
                    maker_signed: {type: boolean}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer or CA out of token scope}
        '404': {description: Non-canonical CA identifier}
        '503': {description: Database unavailable or busy}
  /v1/cas/{ca_id}/precautionary-hold-challenges:
    post:
      summary: One officer asks for a challenge to put a valid certificate on precautionary hold (ADR-0007 section 6, migration 0036)
      description: >
        The signed claim's action is PRECAUTIONARY_SUSPEND. The hold is applied when the
        assertion is submitted to the assertion endpoint, without a checker, and must be
        followed by a dual-controlled revocation or release before its deadline.
      parameters:
        - $ref: '#/components/parameters/CaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serial_hex]
              properties:
                serial_hex: {type: string}
      responses:
        '201': {$ref: '#/components/responses/Challenge'}
        '400': {description: Malformed serial or body}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Non-canonical CA identifier}
        '409': {description: Precautionary holds not enabled for the CA, or the certificate is not valid}
        '503': {description: Database unavailable or busy}
  /v1/cas/{ca_id}/precautionary-holds:
    get:
      summary: Precautionary holds awaiting a dual-controlled revocation or release
      parameters:
        - $ref: '#/components/parameters/CaId'
      responses:
        '200':
          description: Open holds, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [change_id, serial_hex, maker_issuer, maker_subject, held_at_unix, confirm_by_unix, overdue]
                  properties:
                    change_id: {type: string, format: uuid}
                    serial_hex: {type: string}
                    maker_issuer: {type: string}
                    maker_subject: {type: string}
                    held_at_unix: {type: integer}
                    confirm_by_unix: {type: integer}
                    overdue: {type: boolean}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer or CA out of token scope}
        '404': {description: Non-canonical CA identifier}
        '503': {description: Database unavailable or busy}
  /v1/status-changes/{change_id}/rejection-challenges:
    post:
      summary: A checker asks for a challenge to reject a proposal with a signature (migration 0039)
      description: >
        Required on a CA with signed approvals. The claim is the closing claim
        (trust-platform/status-change-close/v1, step REJECT); the assertion goes to the
        assertion endpoint, which closes the change.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '201': {$ref: '#/components/responses/Challenge'}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Unknown or non-canonical change}
        '409': {description: Closed change, or the actor is the maker}
        '503': {description: Database unavailable or busy}
  /v1/status-changes/{change_id}/withdrawal-challenges:
    post:
      summary: The maker asks for a challenge to withdraw a proposal with a signature (migration 0039)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '201': {$ref: '#/components/responses/Challenge'}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Unknown or non-canonical change}
        '409': {description: Closed change, or the actor is not the maker}
        '503': {description: Database unavailable or busy}
  /v1/status-changes/{change_id}/rejection:
    post:
      summary: A checker rejects a proposed change without a signature (refused, 403, on a CA requiring signatures)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200': {$ref: '#/components/responses/Closed'}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Unknown or non-canonical change}
        '409': {description: Closed change, or the actor is the maker}
        '503': {description: Database unavailable or busy}
  /v1/status-changes/{change_id}/withdrawal:
    post:
      summary: The maker withdraws their proposed change without a signature (refused, 403, on a CA requiring signatures)
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200': {$ref: '#/components/responses/Closed'}
        '401': {description: Missing or invalid access token}
        '403': {description: Not an officer, CA out of token scope, or no officer grant}
        '404': {description: Unknown or non-canonical change}
        '409': {description: Closed change, or the actor is not the maker}
        '503': {description: Database unavailable or busy}
components:
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (typ at+jwt, RS256)
  parameters:
    ChangeId:
      name: change_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CaId:
      name: ca_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Closed:
      description: Change closed
      content:
        application/json:
          schema:
            type: object
            required: [change_id]
            properties:
              change_id: {type: string, format: uuid}
    Challenge:
      description: Single-use challenge (five minutes)
      content:
        application/json:
          schema:
            type: object
            required: [challenge_id, change_id, webauthn_challenge, expires_at_us]
            properties:
              challenge_id: {type: string, format: uuid}
              change_id: {type: string, format: uuid}
              webauthn_challenge:
                type: string
                description: base64url SHA-256 of the canonical claim; pass to navigator.credentials.get.
              expires_at_us: {type: integer}
