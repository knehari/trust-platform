name: Lockfile SBOM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Python version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Verify committed SPDX inventory matches both lockfiles
        run: python3 scripts/ci/lockfile_sbom.py --check
