name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build and test with committed lockfile
        run: cargo test --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trust_ci
          POSTGRES_PASSWORD: test-only-not-secret
          POSTGRES_DB: trust_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust_ci -d trust_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply proposed schema to disposable database
        run: |
          set -euo pipefail
          CONTAINER="$(docker ps -q --filter ancestor=postgres:16 | head -n 1)"
          test -n "$CONTAINER"
          docker exec -i "$CONTAINER" psql -U trust_ci -d trust_ci -v ON_ERROR_STOP=1 < migrations/0001_foundation.sql
          docker exec -i "$CONTAINER" psql -U trust_ci -d trust_ci -v ON_ERROR_STOP=1 < tests/schema_invariants.sql
