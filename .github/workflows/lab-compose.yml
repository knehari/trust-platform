name: laboratory-compose

on:
  pull_request:
    paths:
      - compose.lab.yaml
      - Dockerfile.api
      - Dockerfile.signer
      - Dockerfile.publisher
      - crates/crl-publisher/**
      - crates/db-connect/**
      - crates/lab-signer/**
      - crates/pki-core/**
      - frontend/**
      - scripts/lab/**
      - tests/management_browser_e2e_seed.sql
      - migrations/**
      - crates/management-api/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/lab-compose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Node clients verify the API's HTTPS certificate against the lab CA
      # that init-env.sh generates (ADR-0032).
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.lab-keys/tls/ca.crt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate disposable credentials and validate Compose
        run: |
          scripts/lab/init-env.sh
          docker compose --env-file .env.lab -f compose.lab.yaml config --quiet
      - name: Build and start laboratory services
        run: docker compose --env-file .env.lab -f compose.lab.yaml up -d --build --wait --wait-timeout 300
      - name: Generate the audit key in its own token (ADR-0035)
        run: |
          set -euo pipefail
          scripts/lab/create-audit-key-hsm.sh > /dev/null
          openssl pkey -pubin -in .lab-keys/audit/audit-checkpoint.pub.pem -noout -text | grep -q 'ASN1 OID: prime256v1'
          # Never twice: the token refuses a second key under the label.
          if scripts/lab/create-audit-key-hsm.sh > /dev/null 2>&1; then
            echo 'FAIL: a second audit key was generated' >&2
            exit 1
          fi
          test -s .lab-keys/audit/audit-checkpoint.pub.pem
          echo 'PASS: audit key generated in its token; only the public key on the host'
      - name: The API serves verified HTTPS only (ADR-0032)
        run: |
          set -euo pipefail
          curl --fail --silent --cacert .lab-keys/tls/ca.crt https://127.0.0.1:8081/v1/health
          if curl --fail --silent --max-time 5 http://127.0.0.1:8081/v1/health; then
            echo 'FAIL: the API answered plain HTTP' >&2
            exit 1
          fi
          if curl --fail --silent --max-time 5 https://127.0.0.1:8081/v1/health; then
            echo 'FAIL: the API certificate verified without the lab CA' >&2
            exit 1
          fi
          echo 'PASS: HTTPS verified against the lab CA; plain HTTP and unknown CAs refused'
      - name: Exercise Keycloak sign-in, code/PKCE and scoped database reads
        run: |
          set -a; . ./.env.lab; set +a
          node frontend/dev/check-api-compat.mjs
          node frontend/dev/compose-smoke.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned browser test runtime
        run: |
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Exercise console interactions in a real browser
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker compose --env-file .env.lab -f compose.lab.yaml ps -q db)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U trust_lab -d trust_lab -v ON_ERROR_STOP=1 < tests/management_browser_e2e_seed.sql
          set -a; . ./.env.lab; set +a
          node frontend/dev/browser-e2e.mjs
      - name: Refuse unauthorized identities (IAM negative suite)
        run: |
          set -a; . ./.env.lab; set +a
          node frontend/dev/iam-negative.mjs
      - name: Record and submit profile drafts through Keycloak identities
        run: |
          set -a; . ./.env.lab; set +a
          node frontend/dev/profile-lifecycle-e2e.mjs
      - name: Propose a CA and register its OpenSSL root through Keycloak identities
        run: |
          set -a; . ./.env.lab; set +a
          node frontend/dev/ca-proposal-e2e.mjs
      - name: Submit, approve and issue certificate applications on the lab issuing CA
        run: |
          set -a; . ./.env.lab; set +a
          DB_CONTAINER="$(docker compose --env-file .env.lab -f compose.lab.yaml ps -q db)"
          test -n "$DB_CONTAINER"
          # The database owner's own action: grants on the new issuing CA.
          export TRUST_LAB_OWNER_PSQL="docker exec -i $DB_CONTAINER psql -U trust_lab -d trust_lab -v ON_ERROR_STOP=1 -q"
          node frontend/dev/certificate-application-e2e.mjs
      - name: The worker exposes operational metrics (ADR-0038)
        run: |
          set -euo pipefail
          metrics=$(curl --fail --silent http://127.0.0.1:9464/metrics)
          for expected in \
            'trust_metrics_database_up 1' \
            'trust_crl_next_update_seconds{ca_id="dddddddd-dddd-4ddd-8ddd-dddddddddddd"}' \
            'trust_certificates_valid{ca_id="dddddddd-dddd-4ddd-8ddd-dddddddddddd"}' \
            'trust_crl_renewals_total{status="PUBLISHED"}' \
            'trust_worker_task_passes_total{task="audit_seal",result="ok"}'; do
            printf '%s\n' "$metrics" | grep -qF "$expected" || { echo "FAIL: missing $expected" >&2; printf '%s\n' "$metrics" >&2; exit 1; }
          done
          # The worker has sealed at least once by now.
          printf '%s\n' "$metrics" | awk '$1 == "trust_worker_task_passes_total{task=\"audit_seal\",result=\"ok\"}" && $2 > 0 { found = 1 } END { exit !found }'
          if curl --fail --silent --max-time 5 http://127.0.0.1:9464/; then
            echo 'FAIL: the metrics listener serves more than /metrics' >&2
            exit 1
          fi
          echo 'PASS: worker metrics from the database and the worker'
      - name: The laboratory database requires mutual TLS (ADR-0031, ADR-0036)
        run: |
          set -euo pipefail
          set -a; . ./.env.lab; set +a
          DB_CONTAINER="$(docker compose --env-file .env.lab -f compose.lab.yaml ps -q db)"
          test -n "$DB_CONTAINER"
          if docker exec -e PGPASSWORD="$TRUST_LAB_DB_PASSWORD" "$DB_CONTAINER" \
               psql "host=127.0.0.1 user=trust_lab dbname=trust_lab sslmode=disable" -XAtc 'SELECT 1'; then
            echo 'FAIL: the database accepted a plaintext TCP connection' >&2
            exit 1
          fi
          # TLS with the right password but no client certificate: refused.
          out=$(docker exec -e PGPASSWORD="$TRUST_LAB_API_PASSWORD" "$DB_CONTAINER" \
               psql "host=127.0.0.1 user=trust_api_lab dbname=trust_lab sslmode=require" -XAtc 'SELECT 1' 2>&1 || true)
          echo "$out" | grep -q 'connection requires a valid client certificate' \
            || { echo "FAIL: a TLS connection without a client certificate was not refused: $out" >&2; exit 1; }
          # Every network rule the server loaded requires the client
          # certificate (verify-full: lab CA, CN = login), and the services
          # passed the suites above over the network: each of their logins
          # was therefore authenticated by its certificate and its password.
          rules=$(docker exec "$DB_CONTAINER" psql -U trust_lab -d trust_lab -XAt -c \
            "SELECT count(*) FILTER (WHERE type = 'hostssl'), \
                    count(*) FILTER (WHERE type = 'hostssl' AND NOT ('clientcert=verify-full' = ANY (coalesce(options, '{}')))), \
                    count(*) FILTER (WHERE type = 'host'), count(*) FILTER (WHERE error IS NOT NULL) \
             FROM pg_hba_file_rules")
          echo "hostssl rules|without verify-full|host rules|errors: $rules"
          [ "$rules" = '2|0|0|0' ] || { echo 'FAIL: a network rule does not require the client certificate' >&2; exit 1; }
          echo 'PASS: plaintext and certificate-less TLS refused; every network rule requires the login certificate'
      - name: Show bounded service logs on failure
        if: failure()
        run: docker compose --env-file .env.lab -f compose.lab.yaml logs --no-color --tail=80
      - name: Remove disposable stack and volume
        if: always()
        run: docker compose --env-file .env.lab -f compose.lab.yaml down -v --remove-orphans

