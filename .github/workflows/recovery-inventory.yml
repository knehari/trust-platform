name: Recovery inventory
on:
  pull_request:
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch historical PR objects
        run: git fetch origin '+refs/pull/*/head:refs/recovery/pull/*'
      - name: Check frozen historical inventory
        run: python3 scripts/recovery/inventory.py > recovery-inventory.json
      - name: Retain full declarations and omission report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-inventory
          path: recovery-inventory.json
          if-no-files-found: error
