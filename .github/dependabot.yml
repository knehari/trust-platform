# Dependency update proposals. Exact `=x.y.z` pins in Cargo.toml are kept on
# purpose: each update arrives as a reviewable PR, then the SBOM is regenerated
# with `python3 scripts/ci/lockfile_sbom.py`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
