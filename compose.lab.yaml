name: trust-lab

services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: trust_lab
      POSTGRES_DB: trust_lab
      POSTGRES_PASSWORD: ${TRUST_LAB_DB_PASSWORD:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_API_PASSWORD: ${TRUST_LAB_API_PASSWORD:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_WRITER_PASSWORD: ${TRUST_LAB_WRITER_PASSWORD:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_SIGNER_PASSWORD: ${TRUST_LAB_SIGNER_PASSWORD:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PUBLISHER_PASSWORD: ${TRUST_LAB_PUBLISHER_PASSWORD:?Run scripts/lab/init-env.sh first}
      # Public keys only; the private keys stay in .lab-keys/ on the host.
      TRUST_LAB_APPROVER_1_SEC1: ${TRUST_LAB_APPROVER_1_SEC1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_APPROVER_2_SEC1: ${TRUST_LAB_APPROVER_2_SEC1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_CA_APPROVER_1_SEC1: ${TRUST_LAB_CA_APPROVER_1_SEC1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_CA_APPROVER_2_SEC1: ${TRUST_LAB_CA_APPROVER_2_SEC1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_RA_OFFICER_SEC1: ${TRUST_LAB_RA_OFFICER_SEC1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_RA_OFFICER_2_SEC1: ${TRUST_LAB_RA_OFFICER_2_SEC1:?Run scripts/lab/init-env.sh first}
    # TLS only over the network (ADR-0031). The server key is copied with the
    # ownership and mode PostgreSQL requires; the CA key is mounted nowhere.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -o postgres -g postgres -m 700 /run/pgtls &&
        install -o postgres -g postgres -m 600 /lab-tls/db.key /run/pgtls/db.key &&
        install -o postgres -g postgres -m 644 /lab-tls/db.crt /run/pgtls/db.crt &&
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pgtls/db.crt
      - -c
      - ssl_key_file=/run/pgtls/db.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/lab-tls/pg_hba.conf
    volumes:
      - trust_lab_pg:/var/lib/postgresql/data
      - ./migrations:/lab/migrations:ro
      - ./scripts/lab/init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./.lab-keys/tls/db.crt:/lab-tls/db.crt:ro
      - ./.lab-keys/tls/db.key:/lab-tls/db.key:ro
      - ./scripts/lab/pg_hba.conf:/lab-tls/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trust_lab -d trust_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab]

  issuer:
    # Laboratory identity provider: Keycloak in development mode with an
    # in-container H2 store, imported from scripts/lab/keycloak at each fresh
    # start. Development mode is not a production configuration (no external
    # database, no clustering). HTTPS only on 8443 with the lab service CA's
    # certificate (ADR-0033); the management (health) interface stays plain
    # HTTP inside the container and is not published. Image pinned by digest.
    image: keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=8443
      - --https-certificate-file=/lab-tls/idp.crt
      - --https-certificate-key-file=/lab-tls/idp.key
      - --http-management-scheme=http
      - --hostname=https://127.0.0.1:8443
      - --health-enabled=true
    environment:
      # No outbound analytics from the schema tool Keycloak embeds.
      JAVA_OPTS_APPEND: -Dliquibase.analytics.enabled=false
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TRUST_LAB_KC_ADMIN_PASSWORD:?Run scripts/lab/init-env.sh first}
      # Read only by the realm import (${...} placeholders in the realm files).
      TRUST_LAB_WORKLOAD_SECRET: ${TRUST_LAB_WORKLOAD_SECRET:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_READER: ${TRUST_LAB_PW_READER:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_EDITOR: ${TRUST_LAB_PW_EDITOR:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_APPROVER_1: ${TRUST_LAB_PW_APPROVER_1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_APPROVER_2: ${TRUST_LAB_PW_APPROVER_2:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_CA_APPROVER_1: ${TRUST_LAB_PW_CA_APPROVER_1:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_CA_APPROVER_2: ${TRUST_LAB_PW_CA_APPROVER_2:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_REQUESTER: ${TRUST_LAB_PW_REQUESTER:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_RA_OFFICER: ${TRUST_LAB_PW_RA_OFFICER:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_RA_OFFICER_2: ${TRUST_LAB_PW_RA_OFFICER_2:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_OPERATOR: ${TRUST_LAB_PW_OPERATOR:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_CA_ADMIN: ${TRUST_LAB_PW_CA_ADMIN:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_OUTSIDER: ${TRUST_LAB_PW_OUTSIDER:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_DISABLED: ${TRUST_LAB_PW_DISABLED:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_OTHER_CA: ${TRUST_LAB_PW_OTHER_CA:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_FOREIGN: ${TRUST_LAB_PW_FOREIGN:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_PW_AUTHOR: ${TRUST_LAB_PW_AUTHOR:?Run scripts/lab/init-env.sh first}
    volumes:
      - ./scripts/lab/keycloak:/opt/keycloak/data/import:ro
      - ./.lab-keys/tls/idp.crt:/lab-tls/idp.crt:ro
      - ./.lab-keys/tls/idp.key:/lab-tls/idp.key:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081" # API shares this network namespace for exact loopback OIDC issuer URL.
    healthcheck:
      # The image has no curl; bash's /dev/tcp reads the management health endpoint.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [lab]

  signer:
    # Laboratory signer (ADR-0017, Proposed): an independent policy gate that
    # signs approved intents of the lab issuing CA. It listens only on a Unix
    # socket in a volume shared with the API, and its database login can only
    # read the signer view and claim an intent once.
    # The CA key (ADR-0034, Proposed) is generated by
    # scripts/lab/create-lab-root-hsm.sh inside a SoftHSM2 token kept in the
    # trust_signer_hsm volume, sensitive and never extractable; the signer
    # signs through PKCS#11 and never sees it. SoftHSM2 is a software token:
    # no hardware protection, lab only. The entrypoint initialises the token
    # once and drops the SO PIN before starting the signer. It runs as root
    # to read the host-owned 0600 audit key, and hands its 0600 socket to the
    # API's user (nobody).
    build:
      context: .
      dockerfile: Dockerfile.signer
    depends_on:
      db: {condition: service_healthy}
    environment:
      TRUST_SIGNER_SOCKET: /run/trust-signer/signer.sock
      TRUST_SIGNER_SOCKET_OWNER: "65534:65534"
      TRUST_SIGNER_DATABASE_URL: postgresql://trust_signer_lab:${TRUST_LAB_SIGNER_PASSWORD:?Run scripts/lab/init-env.sh first}@db:5432/trust_lab
      TRUST_DATABASE_CA_FILE: /lab-tls/ca.crt
      TRUST_SIGNER_CA_ID: dddddddd-dddd-4ddd-8ddd-dddddddddddd
      TRUST_SIGNER_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      TRUST_SIGNER_PKCS11_TOKEN_LABEL: trust-lab-ca
      TRUST_SIGNER_PKCS11_KEY_LABEL: ca-root-lab-issuing-ca
      TRUST_SIGNER_PKCS11_PIN: ${TRUST_LAB_HSM_PIN:?Run scripts/lab/init-env.sh first}
      TRUST_LAB_HSM_SO_PIN: ${TRUST_LAB_HSM_SO_PIN:?Run scripts/lab/init-env.sh first}
      # Signed audit checkpoints (ADR-0023): a separate audit key, and the
      # signer's memory of its last checkpoint, outside the database.
      TRUST_SIGNER_AUDIT_KEY_FILE: /lab-keys/audit/audit-checkpoint.pem
      TRUST_SIGNER_AUDIT_STATE_FILE: /var/lib/trust-signer/audit-state.json
    volumes:
      - ./.lab-keys/tls/ca.crt:/lab-tls/ca.crt:ro
      - ./.lab-keys/audit:/lab-keys/audit:ro
      - trust_signer_socket:/run/trust-signer
      - trust_signer_state:/var/lib/trust-signer
      - trust_signer_hsm:/var/lib/softhsm/tokens
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/trust-signer/signer.sock"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    network_mode: service:issuer
    depends_on:
      db: {condition: service_healthy}
      issuer: {condition: service_healthy}
      signer: {condition: service_healthy}
    volumes:
      - trust_signer_socket:/run/trust-signer
      - ./.lab-keys/tls/ca.crt:/lab-tls/ca.crt:ro
      - ./.lab-keys/tls/api.crt:/lab-tls/api.crt:ro
      - ./.lab-keys/tls/api.key:/lab-tls/api.key:ro
    environment:
      TRUST_DATABASE_CA_FILE: /lab-tls/ca.crt
      # HTTPS (ADR-0032): no plain HTTP listener.
      TRUST_API_TLS_CERT_FILE: /lab-tls/api.crt
      TRUST_API_TLS_KEY_FILE: /lab-tls/api.key
      TRUST_OIDC_ISSUER: https://127.0.0.1:8443/realms/trust-lab
      TRUST_OIDC_CA_FILE: /lab-tls/ca.crt
      TRUST_OIDC_AUDIENCE: trust-api
      TRUST_OIDC_CLIENT_ID: trust-console
      TRUST_API_BIND: 0.0.0.0:8081
      TRUST_DATABASE_URL: postgresql://trust_api_lab:${TRUST_LAB_API_PASSWORD:?Run scripts/lab/init-env.sh first}@db:5432/trust_lab
      TRUST_WRITER_DATABASE_URL: postgresql://trust_api_writer_lab:${TRUST_LAB_WRITER_PASSWORD:?Run scripts/lab/init-env.sh first}@db:5432/trust_lab
      # Issuance (ADR-0017): the lab signer's socket; without it issuance is 503.
      TRUST_SIGNER_SOCKET: /run/trust-signer/signer.sock
      # Automatic CRL renewal (ADR-0021): a pass every hour publishes the CRL
      # of each CA granted to the renewer whose CRL is due.
      TRUST_CRL_RENEWAL_INTERVAL_SECONDS: "3600"
      # Seal committed audit events into the tamper-evident chain (ADR-0022).
      TRUST_AUDIT_SEAL_INTERVAL_SECONDS: "60"
      # Ask the signer to sign the chain's head (ADR-0023).
      TRUST_AUDIT_CHECKPOINT_INTERVAL_SECONDS: "60"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/lab-tls/ca.crt", "https://127.0.0.1:8081/v1/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Separate CRL publication (ADR-0030): the publisher verifies each CRL and
  # writes the static tree; crl-web serves it read-only, with no database
  # access. The management API serves nothing anonymous.
  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    depends_on:
      db: {condition: service_healthy}
    environment:
      TRUST_PUBLISHER_DATABASE_URL: postgresql://trust_publisher_lab:${TRUST_LAB_PUBLISHER_PASSWORD:?Run scripts/lab/init-env.sh first}@db:5432/trust_lab
      TRUST_PUBLISHER_DIR: /srv/crl
      TRUST_PUBLISHER_INTERVAL_SECONDS: "2"
      TRUST_DATABASE_CA_FILE: /lab-tls/ca.crt
    volumes:
      - trust_crl_public:/srv/crl
      - ./.lab-keys/tls/ca.crt:/lab-tls/ca.crt:ro
    networks: [lab]

  crl-web:
    image: nginx:1.27.4-alpine
    depends_on: [publisher]
    volumes:
      - trust_crl_public:/usr/share/nginx/html:ro
      - ./scripts/lab/crl-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    environment:
      TRUST_API_DEV_TARGET: https://issuer:8081
      # The console's dev proxy verifies the API against the lab CA (ADR-0032).
      NODE_EXTRA_CA_CERTS: /lab-tls/ca.crt
      VITE_OIDC_ISSUER: https://127.0.0.1:8443/realms/trust-lab
      VITE_OIDC_CLIENT_ID: trust-console
      VITE_OIDC_SCOPE: openid profile
    volumes:
      - ./.lab-keys/tls/ca.crt:/lab-tls/ca.crt:ro
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

volumes:
  trust_lab_pg:
  trust_signer_socket:
  trust_signer_state:
  trust_signer_hsm:
  trust_crl_public:

networks:
  lab:

