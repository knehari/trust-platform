# Static CRL distribution for the laboratory (ADR-0030): GET and HEAD of the
# files the publisher wrote, nothing else. No database, no API, no listing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/v1/public/crls/[0-9a-f-]{36}/(latest|[0-9]{1,18})\.crl$ {
        limit_except GET { deny all; }
        types { }
        default_type application/pkix-crl;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
