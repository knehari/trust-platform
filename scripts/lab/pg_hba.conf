# Laboratory PostgreSQL client authentication (ADR-0031, ADR-0036): local
# socket connections (initialisation scripts, the owner's psql inside the
# container) and mutual TLS only over the network. Each network login must
# present a certificate from the lab service CA whose common name is the
# login (clientcert=verify-full) AND its SCRAM password. Plaintext TCP is
# rejected.
local     all all             trust
hostnossl all all 0.0.0.0/0   reject
hostnossl all all ::/0        reject
hostssl   all all 0.0.0.0/0   scram-sha-256 clientcert=verify-full
hostssl   all all ::/0        scram-sha-256 clientcert=verify-full
