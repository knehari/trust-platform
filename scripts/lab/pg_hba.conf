# Laboratory PostgreSQL client authentication (ADR-0031): local socket
# connections (initialisation scripts, the owner's psql inside the container)
# and TLS only over the network. Plaintext TCP is rejected.
local     all all             trust
hostnossl all all 0.0.0.0/0   reject
hostnossl all all ::/0        reject
hostssl   all all 0.0.0.0/0   scram-sha-256
hostssl   all all ::/0        scram-sha-256
