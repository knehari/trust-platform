[workspace]
resolver = "3"
members = ["crates/ca-core", "crates/crypto-provider", "crates/store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
# Licensing not decided yet (intended: commercial core, Apache-2.0 connectors).
# No `license` field until the decision is recorded; crates are not publishable.

[workspace.dependencies]
der = { version = "0.8", features = ["alloc", "oid"] }
x509-cert = { version = "0.3", default-features = false }
spki = { version = "0.8", features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"
crypto-provider = { path = "crates/crypto-provider" }
ca-core = { path = "crates/ca-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
overflow-checks = true
panic = "abort"
